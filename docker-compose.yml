services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - api-data:/srv/data
    environment:
      SESSION_CAP_USD: "2.0"
      DAY_CAP_USD: "5.0"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:1b}
      # No keys baked in. Replay works with none; live tests need a local
      # runner: install Ollama on the host and run `ollama pull gemma3:1b`.
      # Or start the bundled one: `docker compose --profile local-ai up -d`.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
  ollama-data:
