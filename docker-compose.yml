services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 12
    volumes:
      - api-data:/srv/data
    environment:
      SESSION_CAP_USD: "2.0"
      DAY_CAP_USD: "5.0"
      DAILY_QUOTA: "50"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      # No keys baked in. Replay works with none; live tests need
      # GEMINI_API_KEY in the server environment (free tier, quota enforced).
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
