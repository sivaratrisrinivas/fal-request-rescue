services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - api-data:/srv/data
    environment:
      SESSION_CAP_USD: "2.0"
      DAY_CAP_USD: "5.0"
      DAILY_QUOTA: "50"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemma-4-31b-it:free}
      # No keys baked in. Replay works with none; live tests need
      # OPENROUTER_API_KEY in the server environment (free tier, 50/day).
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
